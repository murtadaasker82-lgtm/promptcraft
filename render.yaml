services:
  - type: web
    name: promptcraft
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # صيغة JSON list إلزامية (pydantic-settings). غيّرها لنطاقك الفعلي لاحقًا.
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: OPENROUTER_MODEL
        value: apodex/apodex-1.1-mini:free
      - key: PROMPT_MOCK
        value: "false"
      - key: WHISPER_MOCK
        value: "true"
    disk:
      name: promptcraft-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1