services:
  - type: web
    name: promptcraft
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # سلسلة مفصولة بفواصل. بدّلها بنطاقك الحقيقي قبل الإطلاق.
      - key: CORS_ORIGINS
        value: "*"
      # مفتاح Groq يُضبط من لوحة Render ولا يوضع هنا
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: PROMPT_MOCK
        value: "false"
      - key: WHISPER_MOCK
        value: "true"
      # المصدر الوحيد لقاعدة البيانات. محليًا: sqlite:///./data/promptcraft.db
      # على Render: libsql://<db>.turso.io?authToken=<token>
      - key: DATABASE_URL
        syncPlaceholder: true